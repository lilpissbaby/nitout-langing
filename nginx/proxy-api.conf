# Reenvío a la API. Se incluye en las CUATRO rutas de la API que usa la
# landing (ver landing.conf.template); el resto de /api/ da 404 aquí.
# $api_esquema y $api_upstream los define el server (API_ESQUEMA y
# API_UPSTREAM del .env): en el VPS, http + api-fiestas:8787.
#
# A la API no le llega nada de la sesión: la landing no tiene cuenta, y así
# la respuesta del mapa es la anónima (la que la API cachea) y una cookie de
# app.nitout.com nunca viaja por aquí.

proxy_pass $api_esquema://$api_upstream;
proxy_ssl_server_name on;
proxy_ssl_name $api_upstream;
proxy_set_header Host $api_upstream;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Referer "";
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
# La API manda sus propias cabeceras de seguridad (CSP de JSON, nosniff…):
# aquí mandan las de cabeceras.conf, sin duplicar.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-XSS-Protection;
proxy_hide_header X-Download-Options;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header Origin-Agent-Cluster;
proxy_hide_header X-DNS-Prefetch-Control;
# proxy_read_timeout y la cabecera Origin van en cada location.
