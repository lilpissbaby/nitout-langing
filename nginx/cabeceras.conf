# Cabeceras de seguridad de la landing. Se incluyen en cada location que
# añade cabeceras propias, porque en nginx un add_header dentro de un
# location anula TODOS los heredados del server.
#
# CSP sin 'unsafe-inline' ni en scripts ni en estilos (el JS nunca escribe
# style="" en el HTML; los valores calculados van por CSSOM).
#  - script-src / frame-src: Cloudflare Turnstile, sólo si hay clave en
#    js/config.js; si no, no se carga nada de fuera.
#  - img-src: teselas de CARTO y el respaldo de OSM. Las fotos de las
#    fiestas vienen de /api/imagenes/… en este mismo dominio. data: porque
#    Leaflet pone un GIF vacío de 1 px en las teselas que cancela al moverse
#    (una imagen data: no ejecuta nada).
#  - connect-src 'self': la API va por este dominio (nginx la reenvía).
# scripts/dev.mjs lee ESTE fichero: en local se prueba el mismo CSP.

add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-src https://challenges.cloudflare.com; manifest-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# "all" en producción, "noindex, nofollow" en pruebas (ROBOTS en .env; lo pone la plantilla).
add_header X-Robots-Tag $robots always;
